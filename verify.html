<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>SCP谜异档案入站暗号核对工具 - By laijm</title>
<link rel="shortcut icon" href="https://imgurl.diadi.cn/imgs/2026/09/4f17cceda8351457.png" type="image/x-icon">
<style>
    body {
        font-family: "Noto Serif SC", Georgia, serif;
        background: #ede9df;
        color: #4a4640;
        max-width: 640px;
        margin: 3em auto;
        padding: 0 2em;
        line-height: 1.8;
    }
    h1 {
        font-size: 1.4rem;
        font-weight: 400;
        letter-spacing: 0.2em;
        border-bottom: 1px solid #b8b2a6;
        padding-bottom: 0.5em;
        margin-bottom: 1.5em;
    }
    label {
        display: block;
        margin-top: 1em;
        font-weight: 500;
    }
    input[type="text"] {
        width: 100%;
        padding: 0.5em;
        font-family: "Recursive", Consolas, monospace;
        font-size: 1rem;
        border: 1px solid #b8b2a6;
        background: #f5f1e8;
        color: #4a4640;
        box-sizing: border-box;
    }
    button {
        margin-top: 1.5em;
        padding: 0.6em 2em;
        background: transparent;
        border: 1px solid #b8b2a6;
        color: #4a4640;
        cursor: pointer;
        letter-spacing: 0.1em;
        transition: all 0.2s ease;
    }
    button:hover {
        background: #f5f1e8;
        border-color: #8c887e;
    }
    #result {
        margin-top: 2em;
        padding: 1em;
        border: 1px solid #b8b2a6;
        background: #f5f1e8;
        display: none;
    }
    #result.show {
        display: block;
    }
    .pass { color: #2a7a2a; font-weight: 500; }
    .fail { color: #a02a2a; font-weight: 500; }
    .mono {
        font-family: "Recursive", Consolas, monospace;
        letter-spacing: 0.15em;
        word-break: break-all;
    }
</style>
</head>
<body>

<h1>入站暗号核对工具</h1>

<label>用户提交的暗号：</label>
<input type="text" id="inputCode" placeholder="例如：BR7-ABBABBAABA">

<label>用户提交的抽题记录：</label>
<input type="text" id="inputRecord" placeholder="例如：Q03,Q07,Q12,Q18,Q22,Q25,Q28,Q31,Q35,Q40">

<button onclick="verify()">核对</button>

<div id="result"></div>

<script>
const questionBank = [
    { id: "Q01", answer: "A" },
    { id: "Q02", answer: "A" },
    { id: "Q03", answer: "B" },
    { id: "Q04", answer: "A" },
    { id: "Q05", answer: "A" },
    { id: "Q06", answer: "B" },
    { id: "Q07", answer: "B" },
    { id: "Q08", answer: "A" },
    { id: "Q09", answer: "A" },
    { id: "Q10", answer: "B" },
    { id: "Q11", answer: "B" },
    { id: "Q12", answer: "A" },
    { id: "Q13", answer: "B" },
    { id: "Q14", answer: "A" },
    { id: "Q15", answer: "B" },
    { id: "Q16", answer: "A" },
    { id: "Q17", answer: "B" },
    { id: "Q18", answer: "B" },
    { id: "Q19", answer: "A" },
    { id: "Q20", answer: "A" },
    { id: "Q21", answer: "A" },
    { id: "Q22", answer: "B" },
    { id: "Q23", answer: "A" },
    { id: "Q24", answer: "A" },
    { id: "Q25", answer: "B" },
    { id: "Q26", answer: "A" },
    { id: "Q27", answer: "A" },
    { id: "Q28", answer: "A" },
    { id: "Q29", answer: "B" },
    { id: "Q30", answer: "A" },
    { id: "Q31", answer: "A" },
    { id: "Q32", answer: "A" },
    { id: "Q33", answer: "B" },
    { id: "Q34", answer: "A" },
    { id: "Q35", answer: "A" },
    { id: "Q36", answer: "B" },
    { id: "Q37", answer: "A" },
    { id: "Q38", answer: "B" },
    { id: "Q39", answer: "B" },
    { id: "Q40", answer: "A" },
    { id: "Q41", answer: "A" },
    { id: "Q42", answer: "B" },
    { id: "Q43", answer: "A" },
    { id: "Q44", answer: "B" },
    { id: "Q45", answer: "A" }
];

function verify() {
    const inputCode = document.getElementById("inputCode").value.trim();
    const inputRecord = document.getElementById("inputRecord").value.trim();
    const resultDiv = document.getElementById("result");

    if (!inputCode || !inputRecord) {
        resultDiv.innerHTML = '<p class="fail">请填写暗号和抽题记录。</p>';
        resultDiv.classList.add("show");
        return;
    }

    let answerPart = inputCode;
    if (inputCode.includes("-")) {
        answerPart = inputCode.split("-").slice(1).join("-");
    }

    const ids = inputRecord.split(",").map(s => s.trim().toUpperCase());

    let correctAnswer = "";
    let missing = [];
    ids.forEach(id => {
        const q = questionBank.find(item => item.id === id);
        if (!q) {
            missing.push(id);
        } else {
            correctAnswer += q.answer;
        }
    });

    let html = "";
    html += `<p>用户答案序列：<span class="mono">${answerPart}</span></p>`;
    html += `<p>正确答序列：<span class="mono">${correctAnswer}</span></p>`;

    if (missing.length > 0) {
        html += `<p class="fail">找不到以下题号：${missing.join(", ")}</p>`;
    }

    if (answerPart === correctAnswer && missing.length === 0) {
        html += `<p class="pass">通过</p>`;
    } else {
        html += `<p class="fail">不通过</p>`;
    }

    resultDiv.innerHTML = html;
    resultDiv.classList.add("show");
}
</script>

</body>
</html>
