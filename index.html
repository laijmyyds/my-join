const QUESTION_COUNT = 7;

function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function pickQuestions() {
    return shuffle(questionBank).slice(0, QUESTION_COUNT);
}

function generatePrefix() {
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    const len = 2 + Math.floor(Math.random() * 3);
    let prefix = "";
    for (let i = 0; i < len; i++) {
        prefix += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return prefix;
}

const selectedQuestions = pickQuestions();
const prefix = generatePrefix();

function renderQuiz() {
    const container = document.getElementById("quiz");
    container.innerHTML = "";
    selectedQuestions.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "question";

        const title = document.createElement("div");
        title.className = "question-title";
        title.textContent = `${index + 1}. ${item.q}`;
        div.appendChild(title);

        const shuffledOptions = shuffle(item.options);

        shuffledOptions.forEach((opt) => {
            const label = document.createElement("label");
            label.className = "option";
            const input = document.createElement("input");
            input.type = "radio";
            input.name = `q${index}`;
            input.value = opt.code;
            input.dataset.correct = (opt.code === item.options[item.answer].code) ? "1" : "0";
            label.appendChild(input);
            label.appendChild(document.createTextNode(opt.text));
            div.appendChild(label);
        });

        container.appendChild(div);
    });
}

renderQuiz();

function checkAnswers() {
    const resultDiv = document.getElementById("result");
    const codeOutput = document.getElementById("codeOutput");
    const recordOutput = document.getElementById("recordOutput");
    let code = "";
    let allAnswered = true;

    selectedQuestions.forEach((item, index) => {
        const radios = document.getElementsByName(`q${index}`);
        let selected = null;
        for (const r of radios) {
            if (r.checked) {
                selected = r;
                break;
            }
        }
        if (!selected) {
            allAnswered = false;
            code += "?";
        } else {
            code += selected.value;
        }
    });

    if (!allAnswered) {
        alert("请回答所有问题。");
        return;
    }

    const fullCode = prefix + "-" + code;
    codeOutput.textContent = fullCode;

    const record = selectedQuestions.map(item => item.id).join(",");
    recordOutput.textContent = record;

    resultDiv.classList.add("show");
    resultDiv.scrollIntoView({ behavior: "smooth" });
}
