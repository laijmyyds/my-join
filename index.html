<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>SCP谜谜异案入站验证 - By laijm</title>
<style>
    body {
        font-family: "Noto Serif SC", Georgia, serif;
        background: #ede9df;
        color: #4a4640;
        max-width: 720px;
        margin: 3em auto;
        padding: 0 2em;
        line-height: 1.8;
    }
    h1 {
        font-size: 1.6rem;
        font-weight: 400;
        letter-spacing: 0.2em;
        border-bottom: 1px solid #b8b2a6;
        padding-bottom: 0.5em;
        margin-bottom: 1.5em;
    }
    .question {
        margin-bottom: 2em;
        padding-bottom: 1.5em;
        border-bottom: 1px solid #d4cfc4;
    }
    .question-title {
        font-weight: 500;
        margin-bottom: 0.8em;
    }
    .option {
        display: block;
        margin: 0.4em 0;
        cursor: pointer;
        padding: 0.3em 0.5em;
        border: 1px solid transparent;
        transition: all 0.2s ease;
    }
    .option:hover {
        background: rgba(184, 178, 166, 0.1);
        border-color: #d4cfc4;
    }
    .option input {
        margin-right: 0.6em;
    }
    #result {
        margin-top: 2em;
        padding: 1em;
        background: #f5f1e8;
        border: 1px solid #b8b2a6;
        display: none;
    }
    #result.show {
        display: block;
    }
    #result .code {
        font-family: "Recursive", Consolas, monospace;
        font-size: 1.4rem;
        letter-spacing: 0.15em;
        color: #a0522d;
        text-align: center;
        padding: 1em 0;
        border: 1px dashed #b8b2a6;
        margin: 1em 0;
        word-break: break-all;
    }
    #result .record {
        font-family: "Recursive", Consolas, monospace;
        font-size: 0.9rem;
        color: #7a756c;
        text-align: center;
        padding: 0.5em 0;
        border: 1px dashed #d4cfc4;
        margin: 0.5em 0;
        word-break: break-all;
    }
    button {
        font-family: "Inter", sans-serif;
        padding: 0.6em 2em;
        background: transparent;
        border: 1px solid #b8b2a6;
        color: #4a4640;
        cursor: pointer;
        letter-spacing: 0.1em;
        transition: all 0.2s ease;
    }
    button:hover {
        background: #f5f1e8;
        border-color: #8c887e;
    }
    .note {
        font-size: 0.85rem;
        color: #7a756c;
        margin-top: 1em;
    }
</style>
</head>
<body>

<h1>入站验证</h1>

<p>请回答以下10道判断题。每题选择“是”或“否”，按顺序组合后形成你的入站暗号。</p>
<p class="note">注意：题目每次刷新都会随机变化。请认真阅读站规和世界观后再作答。</p>

<div id="quiz"></div>

<button onclick="checkAnswers()">提交答案</button>

<div id="result">
    <p>你的入站暗号是：</p>
    <div class="code" id="codeOutput"></div>
    <p>抽题记录（请与暗号一起提交）：</p>
    <div class="record" id="recordOutput"></div>
    <p class="note">请将暗号和抽题记录一起填入入站申请。</p>
</div>

<script>
const questionBank = [
    { id: "Q01", q: "在讨论区分享一张包含他人头像的截图，算不算违规？", answer: "A" },
    { id: "Q02", q: "如果我想搬运一篇其他站点的文章，必须标注来源并遵循 CC BY-SA 协议。", answer: "A" },
    { id: "Q03", q: "如果一位职员在你的文章下说「请修改格式」，你可以直接无视。", answer: "B" },
    { id: "Q04", q: "一篇文章包含轻微的血腥描写，应该添加「成人内容」标签。", answer: "A" },
    { id: "Q05", q: "入站申请中，如果暗号格式不对，会被直接拒绝。", answer: "A" },
    { id: "Q06", q: "在讨论区进行角色扮演是被允许的。", answer: "B" },
    { id: "Q07", q: "如果对职员的处理有异议，可以在讨论区公开质疑。", answer: "B" },
    { id: "Q08", q: "本站的文章授权协议是 CC BY-SA。", answer: "A" },
    { id: "Q09", q: "包含邪教、反人类、极端主义的文章会被直接删除且不会有备份。", answer: "A" },
    { id: "Q10", q: "在站内进行编辑时，可以随意修改他人的文章。", answer: "B" },
    { id: "Q11", q: "如果你在站内收到陌生人的私信链接，应该直接点击查看。", answer: "B" },
    { id: "Q12", q: "在社群讨论中进行水贴、钓鱼、洗板是被禁止的。", answer: "A" },
    { id: "Q13", q: "低龄创作者一律禁止入站。", answer: "B" },
    { id: "Q14", q: "如果你发现自己的文章被抄袭，应该联系站务人员并提供证据。", answer: "A" },
    { id: "Q15", q: "本站对成人内容的处理方式是直接删除。", answer: "B" },
    { id: "Q16", q: "反复私信骚扰他人属于违规行为。", answer: "A" },
    { id: "Q17", q: "本站允许讨论敏感政治话题。", answer: "B" },
    { id: "Q18", q: "如果你在站内看到一篇质量很差的文章，可以在评论区辱骂作者。", answer: "B" },
    { id: "Q19", q: "泄露他人个人信息（开盒）是严禁的。", answer: "A" },
    { id: "Q20", q: "故意发布争议性内容引战属于钓鱼行为。", answer: "A" },
    { id: "Q21", q: "短时间内反复发帖（洗板）是被禁止的。", answer: "A" },
    { id: "Q22", q: "如果你对站规有疑问，可以直接无视站规。", answer: "B" },
    { id: "Q23", q: "禁止一切形式的抄袭。", answer: "A" },
    { id: "Q24", q: "在讨论区理性交流是成熟的表现。", answer: "A" },
    { id: "Q25", q: "使用网络图片时不需要标注来源。", answer: "B" },
    { id: "Q26", q: "如果你在站内看到一篇违规文章，应该联系站务人员处理。", answer: "A" },
    { id: "Q27", q: "本站欢迎低龄创作者，但要求行为成熟。", answer: "A" },
    { id: "Q28", q: "在讨论区公开辱骂职员属于不尊重职员。", answer: "A" },
    { id: "Q29", q: "讨论区的图片可以直接发布，不需要折叠。", answer: "B" },
    { id: "Q30", q: "如果你在站内看到一篇包含敏感政治内容的文章，应该联系站务人员处理。", answer: "A" },
    { id: "Q31", q: "恶意刷低分是被禁止的。", answer: "A" },
    { id: "Q32", q: "在评论区指出文章的具体问题属于建设性意见。", answer: "A" },
    { id: "Q33", q: "标签可以随意添加，不需要符合标签规则。", answer: "B" },
    { id: "Q34", q: "如果发现站内有成员泄露他人信息，应该立即联系站务人员。", answer: "A" },
    { id: "Q35", q: "跨站搬运必须标注来源并遵循协议。", answer: "A" },
    { id: "Q36", q: "在站内进行角色扮演是被鼓励的。", answer: "B" },
    { id: "Q37", q: "如果一篇文章包含成人内容，作者必须在标题中注明。", answer: "A" },
    { id: "Q38", q: "本站允许成员在讨论区随意发布政治观点。", answer: "B" },
    { id: "Q39", q: "如果一篇文章被职员锁定，成员可以自行解锁。", answer: "B" },
    { id: "Q40", q: "在站内发布包含他人隐私的截图属于违规行为。", answer: "A" },
    { id: "Q41", q: "本站对抄袭行为采取零容忍政策。", answer: "A" },
    { id: "Q42", q: "如果一篇文章被删除，作者可以要求恢复，无需任何理由。", answer: "B" },
    { id: "Q43", q: "在讨论区使用大量网络热梗会被视为「低龄幼稚」。", answer: "A" },
    { id: "Q44", q: "本站允许成员在文章中使用未经授权的版权图片。", answer: "B" },
    { id: "Q45", q: "如果对站规有疑问，应该私信站务人员询问。", answer: "A" }
];

const QUESTION_COUNT = 10;

function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function pickQuestions() {
    return shuffle(questionBank).slice(0, QUESTION_COUNT);
}

function generatePrefix() {
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    const len = 2 + Math.floor(Math.random() * 3); // 2-4位
    let prefix = "";
    for (let i = 0; i < len; i++) {
        prefix += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return prefix;
}

const selectedQuestions = pickQuestions();
const prefix = generatePrefix();

function renderQuiz() {
    const container = document.getElementById("quiz");
    container.innerHTML = "";
    selectedQuestions.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "question";

        const title = document.createElement("div");
        title.className = "question-title";
        title.textContent = `${index + 1}. ${item.q}`;
        div.appendChild(title);

        const optA = document.createElement("label");
        optA.className = "option";
        const inputA = document.createElement("input");
        inputA.type = "radio";
        inputA.name = `q${index}`;
        inputA.value = "A";
        optA.appendChild(inputA);
        optA.appendChild(document.createTextNode("A. 是 / 正确"));
        div.appendChild(optA);

        const optB = document.createElement("label");
        optB.className = "option";
        const inputB = document.createElement("input");
        inputB.type = "radio";
        inputB.name = `q${index}`;
        inputB.value = "B";
        optB.appendChild(inputB);
        optB.appendChild(document.createTextNode("B. 否 / 错误"));
        div.appendChild(optB);

        container.appendChild(div);
    });
}

renderQuiz();

function checkAnswers() {
    const resultDiv = document.getElementById("result");
    const codeOutput = document.getElementById("codeOutput");
    const recordOutput = document.getElementById("recordOutput");
    let code = "";
    let allAnswered = true;

    selectedQuestions.forEach((item, index) => {
        const radios = document.getElementsByName(`q${index}`);
        let selected = null;
        for (const r of radios) {
            if (r.checked) {
                selected = r;
                break;
            }
        }
        if (!selected) {
            allAnswered = false;
            code += "?";
        } else {
            code += selected.value;
        }
    });

    if (!allAnswered) {
        alert("请回答所有问题。");
        return;
    }

    const fullCode = prefix + "-" + code;
    codeOutput.textContent = fullCode;

    const record = selectedQuestions.map(item => item.id).join(",");
    recordOutput.textContent = record;

    resultDiv.classList.add("show");
    resultDiv.scrollIntoView({ behavior: "smooth" });
}
</script>

</body>
</html>
